<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3d1f">
<title>🦁 BEER O'CLOCK 🍺</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky-top: #7ec8ff;
    --sky-mid: #f9d976;
    --sky-bot: #ff9a3c;
    --jungle-dark: #052b14;
    --jungle-mid: #0b5a2a;
    --jungle-light: #2e9e4f;
    --gold: #ffd166;
    --brown: #6b3f0b;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    background: var(--jungle-dark);
    color: #fff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ================= SKY ================= */
  #sky {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%);
    transition: filter 2s;
  }
  #sun {
    position: absolute;
    top: 8vh; right: 12vw;
    width: clamp(60px, 12vw, 140px);
    height: clamp(60px, 12vw, 140px);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff7c2, #ffd23f 60%, #ff9f1c);
    box-shadow: 0 0 60px 20px rgba(255, 210, 63, 0.6), 0 0 140px 60px rgba(255, 159, 28, 0.35);
    animation: sunSpin 30s linear infinite;
    transition: top 1s linear, right 1s linear;
  }
  #sun::after {
    content: "😎";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: clamp(1.8rem, 5.5vw, 4.2rem);
    animation: sunSpinBack 30s linear infinite;
  }
  @keyframes sunSpin { to { transform: rotate(360deg); } }
  @keyframes sunSpinBack { to { transform: rotate(-360deg); } }

  .cloud {
    position: absolute;
    font-size: clamp(2rem, 6vw, 5rem);
    opacity: 0.85;
    animation: driftCloud linear infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
  @keyframes driftCloud {
    from { transform: translateX(-20vw); }
    to   { transform: translateX(120vw); }
  }

  /* ================= JUNGLE LAYERS ================= */
  #jungle { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  .hills {
    position: absolute; left: -10vw; right: -10vw; bottom: 0;
    height: 42vh;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: var(--jungle-mid);
  }
  .hills.far  { height: 52vh; bottom: 6vh; background: #0f6b33; opacity: 0.8; left: -30vw; right: 20vw; }
  .hills.far2 { height: 48vh; bottom: 8vh; background: #146f3a; opacity: 0.7; left: 30vw; right: -30vw; }
  .hills.near { height: 30vh; background: var(--jungle-dark); }

  .ground {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 14vh;
    background: linear-gradient(180deg, #063d1c, #031f0e);
  }

  /* trees along the bottom edge */
  .tree {
    position: absolute;
    bottom: 8vh;
    font-size: clamp(3rem, 9vw, 8rem);
    line-height: 1;
    transform-origin: bottom center;
    animation: swayTree 5s ease-in-out infinite alternate;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,0.35));
  }
  @keyframes swayTree {
    from { transform: rotate(-2deg); }
    to   { transform: rotate(2deg); }
  }

  /* leaves framing the viewport */
  .leaf {
    position: absolute;
    font-size: clamp(3.5rem, 12vw, 11rem);
    line-height: 1;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5));
    animation: swayLeaf 4s ease-in-out infinite alternate;
  }
  @keyframes swayLeaf {
    from { transform: rotate(var(--r, 0deg)) translateY(0); }
    to   { transform: rotate(calc(var(--r, 0deg) + 6deg)) translateY(6px); }
  }

  /* vines */
  .vine {
    position: absolute; top: -2vh;
    width: 6px;
    height: var(--len, 30vh);
    background: linear-gradient(180deg, #2d7a2f, #1d5a20);
    border-radius: 3px;
    transform-origin: top center;
    animation: swing 3.4s ease-in-out infinite alternate;
  }
  .vine::after {
    content: "🍃";
    position: absolute; bottom: -1.2rem; left: -0.9rem;
    font-size: 2rem;
  }
  .vine .rider {
    position: absolute; bottom: -2.5rem; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(2rem, 5vw, 3.5rem);
    line-height: 1;
  }
  @keyframes swing {
    from { transform: rotate(-14deg); }
    to   { transform: rotate(14deg); }
  }

  /* fireflies */
  .firefly {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff89a;
    box-shadow: 0 0 10px 4px rgba(255, 248, 154, 0.8);
    animation: fly linear infinite, blink 1.6s ease-in-out infinite;
  }
  @keyframes fly {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(6vw, -8vh); }
    50%  { transform: translate(-4vw, -14vh); }
    75%  { transform: translate(8vw, -20vh); }
    100% { transform: translate(0, -28vh); }
  }
  @keyframes blink { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }

  /* ================= STAGE: ANIMALS ================= */
  #stage { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  .animal {
    position: absolute;
    bottom: var(--y, 6vh);
    left: 0;
    font-size: var(--size, 4rem);
    line-height: 1;
    pointer-events: auto;
    cursor: pointer;
    animation: walk var(--dur, 20s) linear infinite;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,0.4));
    z-index: 3;
  }
  .animal.rev { animation-name: walkRev; }
  .animal .body {
    display: inline-block;
    animation: bobWalk 0.5s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .animal.rev .body { transform: scaleX(-1); }
  .animal .hat {
    position: absolute;
    top: -0.55em; left: 50%;
    transform: translateX(-50%) rotate(-15deg);
    font-size: 0.55em;
    display: none;
  }
  .animal .drink {
    position: absolute;
    bottom: 0.1em; right: -0.5em;
    font-size: 0.6em;
    display: none;
    animation: cheersWobble 0.5s ease-in-out infinite;
  }
  @keyframes walk {
    from { transform: translateX(-20vw); }
    to   { transform: translateX(120vw); }
  }
  @keyframes walkRev {
    from { transform: translateX(120vw); }
    to   { transform: translateX(-20vw); }
  }
  @keyframes bobWalk {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-6px) rotate(3deg); }
  }
  .animal.rev .body { animation-name: bobWalkRev; }
  @keyframes bobWalkRev {
    0%, 100% { transform: scaleX(-1) translateY(0) rotate(-3deg); }
    50%      { transform: scaleX(-1) translateY(-6px) rotate(3deg); }
  }
  @keyframes cheersWobble {
    0%, 100% { transform: rotate(-15deg); }
    50%      { transform: rotate(15deg); }
  }

  /* flyers up in the sky */
  .flyer {
    position: absolute;
    top: var(--y, 20vh);
    left: 0;
    font-size: var(--size, 3rem);
    line-height: 1;
    animation: walk var(--dur, 12s) linear infinite, flap 0.35s ease-in-out infinite;
    pointer-events: auto;
    cursor: pointer;
  }
  .flyer.rev { animation-name: walkRev, flap; }
  @keyframes flap {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: -14px; }
  }

  /* speech bubbles */
  .bubble {
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #222;
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive, sans-serif;
    font-weight: 700;
    font-size: clamp(0.8rem, 2vw, 1.05rem);
    padding: 0.4em 0.7em;
    border-radius: 1em;
    white-space: nowrap;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    animation: popIn 0.25s cubic-bezier(.3,1.6,.6,1) both;
    z-index: 50;
  }
  .bubble::after {
    content: "";
    position: absolute;
    top: 100%; left: 50%;
    border: 8px solid transparent;
    border-top-color: #fff;
    transform: translateX(-50%);
  }
  @keyframes popIn { from { transform: translateX(-50%) scale(0); } to { transform: translateX(-50%) scale(1); } }

  /* one-off event sprites (banana throws, water sprays, etc.) */
  .event {
    position: absolute;
    font-size: 2.5rem;
    line-height: 1;
    pointer-events: none;
    animation: arc var(--dur, 2s) ease-in forwards;
  }
  @keyframes arc {
    0%   { transform: translate(0, 0) rotate(0); opacity: 1; }
    50%  { transform: translate(var(--dx), calc(var(--dy) - 30vh)) rotate(360deg); }
    100% { transform: translate(calc(var(--dx) * 2), var(--dy)) rotate(720deg); opacity: 0; }
  }

  /* ================= COUNTDOWN ================= */
  #countdown-view {
    position: fixed; inset: 0; z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 0 16px;
    text-align: center;
    pointer-events: none;
  }

  #label {
    font-size: clamp(1rem, 3.5vw, 2.2rem);
    letter-spacing: 0.3em;
    color: var(--gold);
    text-shadow: 0 3px 0 var(--brown), 0 0 20px rgba(255, 209, 102, 0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  #timer {
    font-size: clamp(3.6rem, 17vw, 14rem);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    line-height: 1;
    background: linear-gradient(180deg, #fff 20%, var(--gold) 60%, #f7931e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 0 var(--brown)) drop-shadow(0 0 30px rgba(255,209,102,0.45));
    animation: bob 3s ease-in-out infinite;
  }
  #timer.urgent { animation: shake 0.3s linear infinite; }
  #timer.final { animation: slam 1s ease-out infinite; color: #ff3b3b; }

  #sub {
    font-size: clamp(0.95rem, 2.8vw, 1.6rem);
    text-shadow: 0 2px 0 rgba(0,0,0,0.5);
    max-width: 90vw;
    background: rgba(0, 40, 15, 0.55);
    padding: 0.4em 1em;
    border-radius: 2em;
    backdrop-filter: blur(4px);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-12px) rotate(1deg); }
  }
  @keyframes shake {
    0% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(4px,-3px) rotate(1deg); }
    50% { transform: translate(-3px,4px) rotate(-1deg); }
    75% { transform: translate(3px,3px) rotate(1deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  @keyframes slam {
    0%   { transform: scale(1.6); filter: drop-shadow(0 6px 0 var(--brown)) brightness(2); }
    30%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  /* the big can being shaken by a monkey */
  #can-rig {
    position: relative;
    margin-top: 1.2rem;
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    pointer-events: auto;
    cursor: pointer;
  }
  #shaker {
    font-size: clamp(2.5rem, 7vw, 5rem);
    line-height: 1;
    transform-origin: bottom center;
    animation: shakeMonkey 0.4s ease-in-out infinite;
  }
  @keyframes shakeMonkey {
    0%, 100% { transform: rotate(-8deg) translateX(-2px); }
    50%      { transform: rotate(8deg) translateX(2px); }
  }
  #bigcan {
    --wobble: 1deg;
    animation: wobble 0.15s linear infinite;
    transform-origin: bottom center;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(calc(var(--wobble) * -1)) translateX(-1px); }
    50%      { transform: rotate(var(--wobble)) translateX(1px); }
  }
  #pressure {
    position: absolute;
    top: -1.6rem; left: 50%;
    transform: translateX(-50%);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    color: #ffb4b4;
    white-space: nowrap;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6);
  }

  /* ================= THE CAN ================= */
  .can {
    --c1: #b8860b; --c2: #ffd700; --c3: #fff3b0; --band: #c1121f;
    position: relative;
    width: var(--w, 64px);
    height: calc(var(--w, 64px) * 1.7);
    border-radius: calc(var(--w, 64px) * 0.16) / calc(var(--w, 64px) * 0.1);
    background: linear-gradient(90deg, var(--c1) 0%, var(--c2) 25%, var(--c3) 45%, var(--c2) 65%, var(--c1) 100%);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15), 0 10px 14px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .can::before {
    content: "";
    position: absolute; top: -3px; left: 4%; right: 4%;
    height: 12%;
    border-radius: 50%;
    background: linear-gradient(180deg, #e8e8e8, #9a9a9a);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3);
  }
  .can::after {
    content: "";
    position: absolute; bottom: -2px; left: 6%; right: 6%;
    height: 8%;
    border-radius: 50%;
    background: #777;
  }
  .can .lbl {
    width: 100%;
    background: var(--band);
    color: #fff;
    text-align: center;
    font-size: calc(var(--w, 64px) * 0.24);
    letter-spacing: 0.05em;
    padding: 0.2em 0;
    text-shadow: 0 1px 0 rgba(0,0,0,0.5);
    line-height: 1.1;
  }
  .can .lbl small { display: block; font-size: 55%; letter-spacing: 0.2em; }
  .can.red   { --c1: #7a0f0f; --c2: #e63946; --c3: #ff8a8a; --band: #ffd166; }
  .can.blue  { --c1: #0b3d91; --c2: #3a86ff; --c3: #a8d0ff; --band: #ffffff; }
  .can.green { --c1: #14532d; --c2: #2ecc71; --c3: #b2ffcc; --band: #1b1b1b; }
  .can.blue .lbl, .can.green .lbl { color: #222; }
  .can.green .lbl { color: #fff; }

  /* ================= PARTY ================= */
  #party-view { position: fixed; inset: 0; z-index: 5; display: none; pointer-events: none; overflow: hidden; }
  body.party #party-view { display: block; }
  body.party #countdown-view { display: none; }

  body.party #sky {
    filter: hue-rotate(200deg) brightness(0.55) saturate(1.6);
  }
  body.party #sun {
    background: radial-gradient(circle at 40% 40%, #fff, #c0c0c0 40%, #7a7a7a 70%, #444);
    box-shadow: 0 0 40px 10px rgba(255,255,255,0.6), 0 0 120px 40px rgba(255, 0, 255, 0.35);
    animation: sunSpin 1.5s linear infinite;
    top: 5vh !important; right: 50% !important;
    transform: translateX(50%);
  }
  body.party #sun::after { content: "🪩"; font-size: clamp(2.6rem, 9vw, 7rem); animation: sunSpinBack 1.5s linear infinite; }

  body.party .animal .hat, body.party .animal .drink { display: block; }
  body.party .animal .body { animation: dance var(--dance, 0.6s) ease-in-out infinite; }
  body.party .animal.rev .body { animation: danceRev var(--dance, 0.6s) ease-in-out infinite; }
  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(-12deg) scale(1); }
    50%      { transform: translateY(-28px) rotate(12deg) scale(1.15); }
  }
  @keyframes danceRev {
    0%, 100% { transform: scaleX(-1) translateY(0) rotate(-12deg) scale(1); }
    50%      { transform: scaleX(-1) translateY(-28px) rotate(12deg) scale(1.15); }
  }
  body.party .flyer { animation-duration: 3s, 0.15s; }
  body.party .vine { animation-duration: 0.9s; }
  body.party .tree { animation-duration: 0.6s; }
  body.party .firefly { background: #ff4df0; box-shadow: 0 0 12px 5px rgba(255, 77, 240, 0.8); animation-duration: 3s, 0.3s; }

  .strobe {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    mix-blend-mode: overlay;
    animation: strobe 0.12s steps(2) infinite;
  }
  @keyframes strobe { 0% { opacity: 0; } 50% { opacity: 0.25; } }

  .spot {
    position: absolute;
    top: -10vh; left: var(--x, 50%);
    width: 18vw; height: 130vh;
    transform-origin: top center;
    mix-blend-mode: screen;
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg, var(--c, rgba(255,0,200,0.6)), transparent 75%);
    animation: sweep var(--d, 2s) ease-in-out infinite alternate;
  }
  @keyframes sweep {
    from { transform: rotate(-30deg); }
    to   { transform: rotate(30deg); }
  }

  #beer-time-text {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(2.6rem, 13vw, 11rem);
    font-weight: 900;
    text-align: center;
    line-height: 0.95;
    color: #fff;
    -webkit-text-stroke: 3px var(--brown);
    text-shadow: 0 8px 0 var(--brown), 0 0 60px rgba(255,255,255,0.8);
    animation: hueSpin 4s linear infinite;
    z-index: 20;
    width: 100%;
    padding: 0 16px;
  }
  .btt-spin, .btt-sway { display: inline-block; }
  .btt-spin { animation: megaSpin 7s linear infinite; }
  @keyframes megaSpin {
    0%, 80% { transform: rotate(0deg); animation-timing-function: ease-in-out; }
    100%    { transform: rotate(1080deg); }
  }
  .btt-sway { animation: swayBoom 2.4s ease-in-out infinite; }
  @keyframes swayBoom {
    0%, 100% { transform: rotate(-5deg) scale(0.85); }
    50%      { transform: rotate(5deg) scale(1.2); }
  }
  @keyframes hueSpin { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

  #cheers-sub {
    position: absolute;
    top: 68%;
    left: 0;
    font-size: clamp(1rem, 3.5vw, 2.2rem);
    color: var(--gold);
    text-shadow: 0 0 16px rgba(255,209,102,0.9), 0 3px 0 var(--brown);
    z-index: 20;
    animation: pulse 0.8s ease-in-out infinite;
    text-align: center;
    width: 100%;
    padding: 0 16px;
  }

  /* raining cans */
  .rain {
    position: absolute;
    top: -30vh;
    left: var(--x, 50%);
    animation: canRain var(--dur, 4s) linear infinite;
    animation-delay: var(--delay, 0s);
    z-index: 12;
  }
  @keyframes canRain {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(150vh) rotate(var(--spin, 720deg)); }
  }

  .flying {
    position: absolute;
    font-size: var(--size, 3rem);
    z-index: 15;
    top: var(--y, 40vh);
    animation: flyAcross var(--dur, 4s) linear infinite;
    animation-delay: var(--delay, 0s);
    pointer-events: none;
  }
  .flying.rev { animation-name: flyAcrossRev; }
  @keyframes flyAcross {
    0%   { transform: translateX(-15vw) rotate(0deg); }
    100% { transform: translateX(115vw) rotate(720deg); }
  }
  @keyframes flyAcrossRev {
    0%   { transform: translateX(115vw) rotate(0deg); }
    100% { transform: translateX(-15vw) rotate(-720deg); }
  }

  .confetti {
    position: absolute;
    width: 12px; height: 12px;
    top: -20px;
    left: var(--x, 50%);
    background: var(--c, #fff);
    z-index: 12;
    animation: confettiFall var(--dur, 4s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-5vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(900deg); }
  }

  /* explosion at 15:00 */
  .spray {
    position: fixed;
    left: var(--x); top: var(--y);
    font-size: var(--size, 1.5rem);
    line-height: 1;
    z-index: 60;
    pointer-events: none;
    animation: sprayOut var(--dur, 1s) ease-out forwards;
  }
  @keyframes sprayOut {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); opacity: 0; }
  }

  #flash {
    position: fixed; inset: 0; z-index: 100;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  #flash.go { animation: flash 1.2s ease-out forwards; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  body.quake { animation: quake 0.25s linear infinite; }
  @keyframes quake {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-6px, 4px); }
    50%  { transform: translate(5px, -5px); }
    75%  { transform: translate(-4px, -4px); }
    100% { transform: translate(0,0); }
  }

  #hint {
    position: fixed;
    bottom: 8px; right: 12px;
    font-size: 0.7rem;
    font-family: monospace;
    opacity: 0.45;
    z-index: 200;
    text-align: right;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-play-state: paused !important; }
    body.quake { animation: none; }
  }
</style>
</head>
<body>

  <!-- ============ SKY ============ -->
  <div id="sky">
    <div id="sun"></div>
    <div class="cloud" style="top: 6vh;  animation-duration: 70s; animation-delay: -10s;">☁️</div>
    <div class="cloud" style="top: 18vh; animation-duration: 95s; animation-delay: -50s; font-size: 3rem;">☁️</div>
    <div class="cloud" style="top: 28vh; animation-duration: 120s; animation-delay: -80s; opacity: 0.6;">☁️</div>
  </div>

  <!-- ============ JUNGLE ============ -->
  <div id="jungle">
    <div class="hills far"></div>
    <div class="hills far2"></div>
    <div class="hills"></div>
    <div class="hills near"></div>
    <div class="ground"></div>

    <div class="tree" style="left: -2vw;  animation-delay: -1s;">🌴</div>
    <div class="tree" style="left: 12vw;  animation-delay: -3s; font-size: clamp(2.5rem, 7vw, 6rem);">🌳</div>
    <div class="tree" style="left: 24vw;  animation-delay: -2s;">🌴</div>
    <div class="tree" style="left: 50vw;  animation-delay: -4s; font-size: clamp(2.5rem, 7vw, 6rem);">🌲</div>
    <div class="tree" style="left: 66vw;  animation-delay: -0.5s;">🌳</div>
    <div class="tree" style="left: 80vw;  animation-delay: -2.5s;">🌴</div>
    <div class="tree" style="left: 92vw;  animation-delay: -1.5s; font-size: clamp(2.5rem, 7vw, 6rem);">🌴</div>

    <div class="leaf" style="top: -3vh; left: -3vw; --r: 20deg;">🌿</div>
    <div class="leaf" style="top: 10vh; left: -6vw; --r: 60deg; animation-delay: -1s;">🍃</div>
    <div class="leaf" style="top: -4vh; right: -3vw; --r: -30deg; animation-delay: -2s; transform: scaleX(-1);">🌿</div>
    <div class="leaf" style="top: 14vh; right: -5vw; --r: -70deg; animation-delay: -0.5s;">🍃</div>
    <div class="leaf" style="bottom: -4vh; left: -4vw; --r: -20deg; animation-delay: -1.5s;">🌿</div>
    <div class="leaf" style="bottom: -5vh; right: -4vw; --r: 200deg; animation-delay: -2.5s;">🌿</div>
    <div class="leaf" style="top: 40vh; left: -7vw; --r: 90deg; animation-delay: -3s; font-size: clamp(2rem, 7vw, 6rem);">🌺</div>
    <div class="leaf" style="top: 45vh; right: -6vw; --r: -90deg; animation-delay: -2s; font-size: clamp(2rem, 7vw, 6rem);">🌺</div>

    <div class="vine" style="left: 18vw; --len: 34vh; animation-delay: -1s;"><span class="rider" data-name="monkey">🐒</span></div>
    <div class="vine" style="left: 34vw; --len: 22vh; animation-delay: -2.3s;"></div>
    <div class="vine" style="left: 62vw; --len: 26vh; animation-delay: -0.4s;"></div>
    <div class="vine" style="left: 78vw; --len: 38vh; animation-delay: -1.7s;"><span class="rider" data-name="sloth">🦥</span></div>
  </div>

  <!-- ============ ANIMALS ============ -->
  <div id="stage"></div>

  <!-- ============ COUNTDOWN ============ -->
  <div id="countdown-view">
    <p id="label">🦁 COUNTDOWN TO BEER O'CLOCK 🐻</p>
    <div id="timer">--:--:--</div>
    <p id="sub">Loading the jungle…</p>
    <div id="can-rig" title="Shake it!">
      <span id="shaker">🐒</span>
      <div id="bigcan" class="can" style="--w: clamp(52px, 9vw, 84px)">
        <div class="lbl">BEER<small>JUNGLE BREW</small></div>
      </div>
      <span id="pressure">PRESSURE: 0%</span>
    </div>
  </div>

  <!-- ============ PARTY ============ -->
  <div id="party-view">
    <div class="strobe"></div>
    <div class="spot" style="--x: 10%; --c: rgba(255,0,200,0.6); --d: 1.8s;"></div>
    <div class="spot" style="--x: 50%; --c: rgba(0,255,120,0.55); --d: 2.6s; animation-delay: -1s;"></div>
    <div class="spot" style="--x: 90%; --c: rgba(0,200,255,0.6); --d: 2.2s; animation-delay: -0.6s;"></div>
    <div id="beer-time-text"><span class="btt-spin"><span class="btt-sway">🍻 BEER<br>O'CLOCK! 🍻</span></span></div>
    <p id="cheers-sub">THE JUNGLE IS OPEN 🦁🐻🐒🍺</p>
  </div>

  <div id="flash"></div>
  <div id="hint">click the animals · ?test=10 · ?party=1</div>

<script>
(() => {
  const TARGET_HOUR = 15;
  const $ = id => document.getElementById(id);
  const timerEl = $('timer'), subEl = $('sub'), stage = $('stage'), party = $('party-view');
  const bigcan = $('bigcan'), pressure = $('pressure'), sun = $('sun');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const pad = n => String(n).padStart(2, '0');

  // ---------- target time ----------
  const params = new URLSearchParams(location.search);
  const testSecs = parseInt(params.get('test'), 10);
  let target;
  if (testSecs > 0) {
    target = Date.now() + testSecs * 1000;
  } else {
    const t = new Date();
    t.setHours(TARGET_HOUR, 0, 0, 0);
    target = t.getTime();
  }
  if (params.get('party')) target = Date.now() - 1;
  const fillWindow = testSecs > 0 ? testSecs * 1000 : 6 * 3600 * 1000; // 09:00 → 15:00

  // ---------- speech ----------
  const lines = {
    lion:     ['ROOOAR… I mean, cheers.', 'King of the jungle, king of the bar.', 'Is it 15:00 yet? Asking for a pride.', 'I only hunt for happy hour.'],
    bear:     ['Honey is fine. Beer is better.', 'Hibernation can wait.', "I've been sober since… breakfast.", 'Bear with me until 15:00.'],
    monkey:   ['Shake shake shake!', 'Bananas are just beer that grew up.', 'Monkey see, monkey drink.', 'Who put the lime in the coconut?'],
    tiger:    ['Earning my stripes at the bar.', 'Grrrreat, still not 15:00.', 'Tiger blood? No, tiger brew.'],
    elephant: ['I never forget beer o\'clock.', 'Trunk full of ice, ready to go.', 'Big animal, big thirst.'],
    parrot:   ['BEER O\'CLOCK! BEER O\'CLOCK! 🦜', 'Polly wants a pilsner.', 'Squawk if you\'re thirsty!'],
    snake:    ['Sssso close now…', 'Hisssstory says beer is at 15:00.', 'I have no hands. Pour it in.'],
    frog:     ['Ribbit. That means "cheers".', 'Hop to the fridge!', 'Cold-blooded, cold beer.'],
    gorilla:  ['I lift kegs for fun.', 'Chest thumping = 5 minutes left.', 'Beer. Now. Please.'],
    sloth:    ['…is…it…15:00…yet…', '…I…was…born…ready…', '…slow…sip…'],
    toucan:   ['Toucan play at this game.', 'My beak is a bottle opener.', 'Fruit loops? No, hop loops.'],
    hippo:    ['Hungry hungry for hops.', 'Mud bath now, beer bath at 15:00.'],
    crocodile:['Snap! Almost time.', 'See you later, I\'ll be at the bar.'],
    flamingo: ['Standing on one leg, holding one beer.', 'Pink and ready to drink.'],
    party:    ['CHEERS! 🍻', 'BEER O\'CLOCK!!!', 'Refill!', 'To the jungle!', 'One more!', 'Skål!', 'Prost!', 'Best time of the day!', 'WOOOO!'],
  };

  function say(el, text, ms = 2600) {
    el.querySelector('.bubble')?.remove();
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    el.appendChild(b);
    setTimeout(() => b.remove(), ms);
  }

  function talk(el) {
    const set = document.body.classList.contains('party') ? lines.party : (lines[el.dataset.name] || lines.party);
    say(el, pick(set));
  }

  // ---------- animals ----------
  const walkers = [
    ['lion', '🦁'], ['bear', '🐻'], ['tiger', '🐯'], ['elephant', '🐘'], ['gorilla', '🦍'],
    ['monkey', '🐒'], ['snake', '🐍'], ['frog', '🐸'], ['hippo', '🦛'], ['crocodile', '🐊'],
    ['bear', '🐻‍❄️'], ['lion', '🦁'], ['flamingo', '🦩'], ['bear', '🐻'],
  ];
  const flyers = [['parrot', '🦜'], ['toucan', '🦜'], ['parrot', '🦋'], ['toucan', '🐦'], ['parrot', '🦜']];
  const hats = ['🎉', '🎩', '👑', '🥳', '🎀', '🧢'];
  const drinks = ['🍺', '🍻', '🥤', '🍺'];

  function spawnWalker([name, emoji], i) {
    const el = document.createElement('div');
    el.className = 'animal' + (Math.random() < 0.5 ? ' rev' : '');
    el.dataset.name = name;
    el.style.setProperty('--y', rnd(4, 14).toFixed(1) + 'vh');
    el.style.setProperty('--size', 'clamp(2.2rem, ' + rnd(5, 8).toFixed(1) + 'vw, 5.5rem)');
    el.style.setProperty('--dur', rnd(18, 40).toFixed(1) + 's');
    el.style.setProperty('--dance', rnd(0.4, 0.9).toFixed(2) + 's');
    el.style.animationDelay = (-Math.random() * 40).toFixed(1) + 's';
    el.innerHTML = `<span class="hat">${pick(hats)}</span><span class="body">${emoji}</span><span class="drink">${pick(drinks)}</span>`;
    el.addEventListener('click', e => { e.stopPropagation(); talk(el); });
    stage.appendChild(el);
    return el;
  }
  function spawnFlyer([name, emoji]) {
    const el = document.createElement('div');
    el.className = 'flyer' + (Math.random() < 0.5 ? ' rev' : '');
    el.dataset.name = name;
    el.style.setProperty('--y', rnd(8, 40).toFixed(1) + 'vh');
    el.style.setProperty('--size', 'clamp(1.6rem, ' + rnd(3, 5).toFixed(1) + 'vw, 3.5rem)');
    el.style.setProperty('--dur', rnd(10, 22).toFixed(1) + 's');
    el.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's, 0s';
    el.textContent = emoji;
    el.addEventListener('click', e => { e.stopPropagation(); talk(el); });
    stage.appendChild(el);
    return el;
  }
  walkers.forEach(spawnWalker);
  flyers.forEach(spawnFlyer);

  document.querySelectorAll('.rider').forEach(r => {
    r.style.pointerEvents = 'auto';
    r.style.cursor = 'pointer';
    r.addEventListener('click', e => { e.stopPropagation(); talk(r); });
  });

  // fireflies
  const jungle = $('jungle');
  for (let i = 0; i < 24; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = rnd(0, 100) + 'vw';
    f.style.top = rnd(40, 100) + 'vh';
    f.style.animationDuration = rnd(8, 18).toFixed(1) + 's, ' + rnd(1, 2.5).toFixed(1) + 's';
    f.style.animationDelay = (-rnd(0, 18)).toFixed(1) + 's, ' + (-rnd(0, 2)).toFixed(1) + 's';
    jungle.appendChild(f);
  }

  // ---------- random jungle events ----------
  function throwThing(emoji, fromEl) {
    const r = fromEl.getBoundingClientRect();
    const ev = document.createElement('div');
    ev.className = 'event';
    ev.textContent = emoji;
    ev.style.left = r.left + r.width / 2 + 'px';
    ev.style.top = r.top + 'px';
    const dir = Math.random() < 0.5 ? -1 : 1;
    ev.style.setProperty('--dx', dir * rnd(10, 25) + 'vw');
    ev.style.setProperty('--dy', rnd(5, 20) + 'vh');
    ev.style.setProperty('--dur', rnd(1.5, 2.5) + 's');
    stage.appendChild(ev);
    setTimeout(() => ev.remove(), 3000);
  }

  const events = [
    () => { const m = pick([...stage.querySelectorAll('[data-name="monkey"], [data-name="gorilla"]')]); if (m) { say(m, 'Banana incoming!'); throwThing('🍌', m); } },
    () => { const e = stage.querySelector('[data-name="elephant"]'); if (e) { say(e, 'PFFFFT 💦'); for (let i = 0; i < 4; i++) setTimeout(() => throwThing('💦', e), i * 120); } },
    () => { const a = pick([...stage.querySelectorAll('.animal')]); talk(a); },
    () => { const p = pick([...stage.querySelectorAll('.flyer')]); talk(p); },
    () => { const s = document.querySelector('[data-name="sloth"]'); if (s) say(s, pick(lines.sloth), 5000); },
    () => { const l = stage.querySelector('[data-name="lion"]'); if (l) { say(l, 'ROOOOOOAR!!!'); document.body.classList.add('quake'); setTimeout(() => document.body.classList.remove('quake'), 500); } },
    () => { const b = stage.querySelector('[data-name="bear"]'); if (b) { say(b, 'Where is the fridge?! 🧊'); throwThing('🍯', b); } },
    () => { const f = stage.querySelector('[data-name="frog"]'); if (f) { say(f, 'Ribbit!'); throwThing('🪰', f); } },
    () => { const c = stage.querySelector('[data-name="crocodile"]'); if (c) say(c, 'Snap snap 🦷'); },
  ];
  setInterval(() => pick(events)(), 4500);
  setTimeout(() => pick(events)(), 1200);

  // ---------- sub lines ----------
  const subLines = [
    'The lions are guarding the fridge 🦁🧊',
    'A bear is sniffing out the nearest tap 🐻',
    'The monkeys are shaking the cans (do not open) 🐒',
    'The parrot has learned one word: BEER 🦜',
    'The snake is chilling the glasses 🐍🥶',
    'Somewhere in the jungle, a keg is getting nervous 🛢️',
    'Hydrate now, celebrate later 💧',
    'The sloth is on its way. It left on Tuesday. 🦥',
    'The elephant never forgets beer o\'clock 🐘',
    'Beer thirty is almost upon us ⏰',
    'The frog says ribbit. Ribbit means cheers. 🐸',
    'Toucan play at this game 🦜🍺',
  ];
  let subIdx = 0;
  subEl.textContent = subLines[0];
  setInterval(() => { subIdx = (subIdx + 1) % subLines.length; subEl.textContent = subLines[subIdx]; }, 5000);

  // ---------- big can ----------
  let extraShake = 0;
  $('can-rig').addEventListener('click', e => {
    e.stopPropagation();
    extraShake = Math.min(extraShake + 2, 14);
    say($('shaker'), pick(['SHAKE!', 'Harder!', 'Almost…', 'Do NOT open', 'Fizzzz']), 900);
    setTimeout(() => { extraShake = Math.max(0, extraShake - 2); }, 1500);
  });

  // ---------- countdown ----------
  let partyStarted = false;
  let lastSecond = null;

  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) { if (!partyStarted) startParty(); return; }

    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    timerEl.textContent = h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;

    timerEl.classList.toggle('urgent', diff < 60000 && diff >= 10000);
    timerEl.classList.toggle('final', diff < 10000);
    document.body.classList.toggle('quake', diff < 10000);
    if (diff < 10000 && s !== lastSecond) {
      lastSecond = s;
      document.title = `${s + 1}… 🍺`;
      const a = pick([...stage.querySelectorAll('.animal')]);
      say(a, String(s + 1) + '!', 900);
    } else if (diff >= 10000) {
      document.title = `${timerEl.textContent} 🦁 BEER O'CLOCK`;
    }

    // pressure in the can: 0% at start of the window → 100% at 15:00
    const frac = Math.min(1, Math.max(0, 1 - diff / fillWindow));
    pressure.textContent = 'PRESSURE: ' + Math.round(frac * 100) + '%';
    const w = 1 + frac * frac * 10 + extraShake + (diff < 60000 ? 8 : 0);
    bigcan.style.setProperty('--wobble', w.toFixed(1) + 'deg');
    bigcan.style.animationDuration = Math.max(0.05, 0.2 - frac * 0.15) + 's';
    $('shaker').style.animationDuration = Math.max(0.12, 0.5 - frac * 0.35) + 's';

    // the sun slides down toward the horizon as beer o'clock approaches
    sun.style.top = (8 + frac * 30) + 'vh';
    sun.style.right = (12 + frac * 30) + 'vw';
  }

  // ---------- PARTY ----------
  function makeCan(cls, w) {
    const c = document.createElement('div');
    c.className = 'can ' + cls;
    c.style.setProperty('--w', w + 'px');
    c.innerHTML = '<div class="lbl">BEER<small>JUNGLE</small></div>';
    return c;
  }
  const canColors = ['', 'red', 'blue', 'green'];

  function explodeAt(x, y, count = 40, emojis = ['🫧', '💦', '🍺', '✨', '🍻']) {
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'spray';
      s.textContent = pick(emojis);
      s.style.setProperty('--x', x + 'px');
      s.style.setProperty('--y', y + 'px');
      const ang = Math.random() * Math.PI * 2, dist = rnd(120, 520);
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist - 150 + 'px');
      s.style.setProperty('--size', rnd(1, 3) + 'rem');
      s.style.setProperty('--dur', rnd(0.7, 1.6) + 's');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1800);
    }
  }

  function startParty() {
    partyStarted = true;
    document.body.classList.remove('quake');
    document.title = "🍻🍻🍻 BEER O'CLOCK 🍻🍻🍻";

    // the big can finally explodes
    const r = bigcan.getBoundingClientRect();
    explodeAt(r.left + r.width / 2, r.top + r.height / 2, 80);
    $('flash').classList.add('go');

    setTimeout(() => {
      document.body.classList.add('party');
      document.querySelectorAll('.rider').forEach(r => { if (r.dataset.name === 'sloth') r.textContent = '🦥🍺'; });

      // everyone speeds up and talks nonsense
      stage.querySelectorAll('.animal').forEach(a => {
        a.style.setProperty('--dur', rnd(6, 14).toFixed(1) + 's');
        setTimeout(() => talk(a), rnd(0, 4000));
      });
      // reinforcements arrive
      const extras = [['lion', '🦁'], ['bear', '🐻'], ['monkey', '🐒'], ['gorilla', '🦍'], ['tiger', '🐯'], ['frog', '🐸'], ['hippo', '🦛'], ['zebra', '🦓'], ['giraffe', '🦒']];
      extras.forEach((w, i) => { const el = spawnWalker(w, i); el.style.setProperty('--dur', rnd(6, 14).toFixed(1) + 's'); });
      const skyExtras = [['parrot', '🦜'], ['parrot', '🦜'], ['toucan', '🦋'], ['parrot', '🐦']];
      skyExtras.forEach(spawnFlyer);

      // raining beer cans
      for (let i = 0; i < 26; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'rain';
        wrap.style.setProperty('--x', rnd(0, 96) + 'vw');
        wrap.style.setProperty('--dur', rnd(2.5, 6) + 's');
        wrap.style.setProperty('--delay', -rnd(0, 6) + 's');
        wrap.style.setProperty('--spin', (Math.random() < 0.5 ? -1 : 1) * rnd(360, 1080) + 'deg');
        wrap.appendChild(makeCan(pick(canColors), rnd(28, 60)));
        party.appendChild(wrap);
      }
      // flying beers, bananas and whatever else the jungle had lying around
      const fly = ['🍺', '🍻', '🍌', '🥥', '🍺', '🍍', '🥂', '🍺', '🎉', '🦴'];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('div');
        el.className = 'flying' + (i % 2 ? ' rev' : '');
        el.textContent = fly[i % fly.length];
        el.style.setProperty('--y', rnd(5, 85) + 'vh');
        el.style.setProperty('--size', rnd(2, 5) + 'rem');
        el.style.setProperty('--dur', rnd(2.5, 6) + 's');
        el.style.setProperty('--delay', -rnd(0, 5) + 's');
        party.appendChild(el);
      }
      // confetti
      const colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ffffff', '#ff8fab'];
      for (let i = 0; i < 90; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.setProperty('--x', rnd(0, 100) + 'vw');
        c.style.setProperty('--c', pick(colors));
        c.style.setProperty('--dur', rnd(2.5, 6) + 's');
        c.style.setProperty('--delay', -rnd(0, 6) + 's');
        c.style.borderRadius = Math.random() < 0.5 ? '50%' : '0';
        party.appendChild(c);
      }
      // party chatter
      const cheers = ['THE JUNGLE IS OPEN 🦁🐻🐒🍺', 'THE LION HAS DECLARED HAPPY HOUR 🦁', 'THE BEAR FOUND THE FRIDGE 🐻🧊', 'MONKEYS ON THE BAR 🐒🍻', 'SKÅL! PROST! CHEERS! 🍻', 'THE SLOTH JUST ARRIVED 🦥🍺'];
      let ci = 0;
      setInterval(() => { ci = (ci + 1) % cheers.length; $('cheers-sub').textContent = cheers[ci]; }, 3000);
      setInterval(() => { const a = pick([...stage.querySelectorAll('.animal, .flyer')]); talk(a); }, 1800);
      setInterval(() => explodeAt(rnd(0, innerWidth), rnd(0, innerHeight * 0.6), 14, ['🎆', '✨', '🎇', '🍺']), 2500);
    }, 350);
  }

  // clicks anywhere = beer bursts (party) or a startled animal (countdown)
  document.addEventListener('click', e => {
    if (document.body.classList.contains('party')) {
      explodeAt(e.clientX, e.clientY, 18);
    } else {
      explodeAt(e.clientX, e.clientY, 6, ['🍃', '🌿', '🦋']);
    }
  });

  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
