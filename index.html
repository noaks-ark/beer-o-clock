<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120e3e" />
  <title>🍺 BEER O'CLOCK 🍺</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="overlay">
    <p id="caption">Countdown to beer time</p>
    <div id="bottom">
      <p id="sub" aria-live="polite">Polishing the neon…</p>
      <p id="dj" hidden>DJ FREDAG on the decks</p>
      <p id="hint">?test=10 for a 10 second demo · ?party=1 to skip straight to the party</p>
    </div>
  </div>

  <div id="fallback" hidden>
    <p id="fallback-time">--:--</p>
    <p>Your browser can't run WebGL, but the beer is still coming.</p>
  </div>

  <noscript>
    <div id="noscript">Beer time is 15:00. Enable JavaScript for the light show.</div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
