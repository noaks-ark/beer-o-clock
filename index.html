<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#5d6671" />
  <title>🍺 BEER O'CLOCK 🍺</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="overlay">
    <p id="caption">Countdown to beer o'clock · Oktoberfest</p>
    <div id="bottom">
      <p id="clockline" aria-live="off">--:--:--</p>
      <p id="sub" aria-live="polite">Opening the umbrellas…</p>
    </div>
  </div>

  <div id="bubbles" aria-hidden="true"></div>
  <div id="flash"></div>

  <div id="fallback" hidden>
    <p id="fallback-time">--:--</p>
    <p>Your browser can't run WebGL, but the beer is still coming at 15:00.</p>
  </div>

  <noscript>
    <div id="noscript">Beer time is 15:00. Enable JavaScript for the town.</div>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
